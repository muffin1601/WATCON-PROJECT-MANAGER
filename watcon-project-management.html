<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watcon Project Management Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12262E; --muted:#5B6E74; --bg:#EFF3F4; --surface:#FFFFFF;
  --primary:#0E6E7A; --primary-dark:#0A4E57; --primary-soft:#E2F0F1;
  --accent:#C99A3C; --line:#D6DFE1; --ok:#1E7F4F; --ok-soft:#E4F2EA;
  --danger:#B3372E; --danger-soft:#F7E7E5; --warn:#9A6A15; --warn-soft:#F6EEDB;
  --radius:10px; --shadow:0 1px 3px rgba(18,38,46,.08), 0 4px 14px rgba(18,38,46,.05);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
h1,h2,h3,h4{line-height:1.25}
.mono{font-family:var(--mono)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Header ---------- */
header.app{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50}
header.app .bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:19px;font-weight:800;letter-spacing:.3px}
.brand span{font-size:11.5px;color:#9DBCC2;letter-spacing:.14em;text-transform:uppercase}
.waterline{height:3px;background:linear-gradient(90deg,var(--primary) 0%,#35C4CF 45%,var(--accent) 100%)}
nav.top{margin-left:auto;display:flex;gap:8px}
nav.top button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#E8F1F2;border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600}
nav.top button:hover{background:rgba(255,255,255,.1)}
nav.top button.primary{background:var(--primary);border-color:var(--primary)}
nav.top button.primary:hover{background:var(--primary-dark)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

/* ---------- Cards & layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .hd h3{font-size:15px;font-weight:700}
.card .bd{padding:18px}
.grid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:6px}
.stat.hl{border-left:3px solid var(--primary)}
.stat .val.pos{color:var(--ok)} .stat .val.neg{color:var(--danger)}

/* ---------- Forms ---------- */
label.f{display:block;margin-bottom:14px}
label.f span.t{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
.btn:hover{background:#F3F6F7}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.p:hover{background:var(--primary-dark)}
.btn.d{color:var(--danger);border-color:#E4C4C0}
.btn.d:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border:none;background:none;color:var(--primary);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{border:none;background:#fff;padding:8px 15px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--primary-soft);color:var(--primary-dark)}

/* ---------- Tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none}
.tbl-wrap{overflow-x:auto}

/* ---------- Chips & badges ---------- */
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:3px 10px}
.chip.teal{background:var(--primary-soft);color:var(--primary-dark)}
.chip.gold{background:var(--warn-soft);color:var(--warn)}
.chip.green{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.grey{background:#E7ECED;color:var(--muted)}

/* ---------- Project list ---------- */
.plist{display:grid;gap:12px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.pitem:hover{border-color:var(--primary)}
.pitem h4{font-size:16px;font-weight:700}
.pitem .sub{font-size:13px;color:var(--muted);margin-top:3px}
.pitem .nums{text-align:right;font-size:12.5px;color:var(--muted)}
.pitem .nums .money{font-size:15px;color:var(--ink)}
.bar-track{height:5px;background:#E2E9EA;border-radius:99px;margin-top:10px;grid-column:1/-1;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:99px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:18px 0;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--primary-dark);border-bottom-color:var(--primary)}

/* ---------- Attachments ---------- */
.att{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px;background:#FAFBFB}
.att .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.att .mt{color:var(--muted);font-size:12px;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:13.5px;background:#FAFBFB;cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-soft)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(12,26,32,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .hd h3{font-size:16px;font-weight:700}
.modal .hd button{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted);line-height:1}
.modal .bd{padding:20px}
.modal .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ---------- Misc ---------- */
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.note{font-size:12.5px;color:var(--muted)}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--primary-dark)}
.ai-badge::before{content:'';width:8px;height:8px;border-radius:99px;background:var(--accent)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--primary-soft);border-top-color:var(--primary);border-radius:99px;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:var(--shadow)}
.back{border:none;background:none;color:var(--primary-dark);font-weight:700;font-size:13.5px;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:6px}

/* ---------- Print (challan / bill) ---------- */
#printArea{display:none}
.doc{max-width:190mm;margin:0 auto;font-size:12px;color:#000;background:#fff}
.doc .dhead{display:flex;justify-content:space-between;border-bottom:2.5px solid #000;padding-bottom:10px}
.doc .dhead h1{font-size:20px;letter-spacing:.5px}
.doc .dhead .co{font-size:11px;line-height:1.45}
.doc .dtitle{text-align:center;font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:12px 0;border:1.5px solid #000;padding:5px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc table th,.doc table td{border:1px solid #000;padding:5px 7px;font-size:11.5px;text-align:left}
.doc table td.r,.doc table th.r{text-align:right;font-family:var(--mono)}
.doc .meta{display:flex;justify-content:space-between;gap:20px;margin-top:8px;font-size:11.5px}
.doc .sig{display:flex;justify-content:space-between;margin-top:60px;font-size:11.5px}
.doc .sig div{border-top:1px solid #000;padding-top:5px;width:180px;text-align:center}
.doc-preview{border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;background:#fff}
@media print{
  body>*{display:none !important}
  body{background:#fff}
  #printArea{display:block !important;font-family:var(--sans)}
}
@media(max-width:640px){
  header.app .bar{padding:12px 14px}
  main{padding:16px 12px 70px}
  .pitem{grid-template-columns:1fr}
  .pitem .nums{text-align:left}
}
</style>
</head>

    <nav class="top">

      <button id="navSettings">Settings</button>
      <button id="navNew" class="primary">+ New Project</button>
    </nav>
  </div>
  <div class="waterline"></div>
</header>
<main id="app"></main>
<div id="printArea"></div>

/* ---------------- Financial math ---------------- */
function orderBase(p){ return (p.items||[]).reduce((s,i)=>s + (Number(i.qty)||0)*(Number(i.rate)||0), 0); }
function amendTotal(p){ return (p.amendments||[]).reduce((s,a)=>s + (Number(a.valueChange)||0), 0); }
function discountTotal(p){ return (p.discounts||[]).reduce((s,d)=>s + (Number(d.amount)||0), 0); }
function gstOn(p, amt){ return p.terms && p.terms.gst==='extra' ? amt * (Number(state.settings.gstRate)||18)/100 : 0; }
function contractValue(p){ const base = orderBase(p) + amendTotal(p) - discountTotal(p); return base + gstOn(p, base); }
function dispatchedQty(p, itemId, uptoDate){
  let q=0; (p.challans||[]).forEach(c=>{ if(uptoDate && c.date>uptoDate) return;
    (c.items||[]).forEach(ci=>{ if(ci.itemId===itemId) q+=Number(ci.qty)||0; }); }); return q;
}
function extraQtyOf(p, itemId, uptoDate){
  let q=0; (p.challans||[]).forEach(c=>{ if(uptoDate && c.date>uptoDate) return;
    (c.items||[]).forEach(ci=>{ if(ci.itemId===itemId) q+=Number(ci.extraQty)||0; }); }); return q;
}
function customDispatched(p, uptoDate){ // items sent that are not in the sales order, aggregated
  const map={};
  (p.challans||[]).forEach(c=>{ if(uptoDate && c.date>uptoDate) return;
    (c.extraItems||[]).forEach(x=>{ const k=(x.description||'').trim().toLowerCase()+'|'+(x.unit||'');
      if(!map[k]) map[k]={description:x.description,unit:x.unit||'Nos',qty:0,rate:Number(x.rate)||0};
      map[k].qty+=Number(x.qty)||0; if(Number(x.rate)) map[k].rate=Number(x.rate); }); });
  return Object.values(map);
}
function dispatchedValue(p, uptoDate){
  let v=0; (p.items||[]).forEach(it=>{ v += (dispatchedQty(p,it.id,uptoDate)+extraQtyOf(p,it.id,uptoDate))*(Number(it.rate)||0); });
  customDispatched(p,uptoDate).forEach(x=>{ v += x.qty*(x.rate||0); });
  // items on challans not linked to sales order (attached Zoho challans with own value)
  (p.challans||[]).forEach(c=>{ if(uptoDate && c.date>uptoDate) return; if(c.manualValue) v+=Number(c.manualValue)||0; });
  return v;
}
function challanValue(p,c){
  if(c.manualValue) return Number(c.manualValue)||0;
  let v=0; (c.items||[]).forEach(ci=>{ const it=p.items.find(x=>x.id===ci.itemId); if(it) v+=((Number(ci.qty)||0)+(Number(ci.extraQty)||0))*(Number(it.rate)||0); });
  (c.extraItems||[]).forEach(x=>{ v+=(Number(x.qty)||0)*(Number(x.rate)||0); });
  return v;
}

/* ---------------- Claude AI ---------------- */
async function askClaude(contentBlocks, maxTokens){
  const headers={'Content-Type':'application/json'};
  if(state.settings.apiKey){ headers['x-api-key']=state.settings.apiKey; headers['anthropic-version']='2023-06-01'; headers['anthropic-dangerous-direct-browser-access']='true'; }
  const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens||3000,messages:[{role:'user',content:contentBlocks}]})});
  const data = await r.json();
  if(!data.content) throw new Error(data.error?.message || 'AI request failed');
  return data.content.map(b=>b.text||'').join('\n');
}
function fileBlock(att){
  if(att.type==='application/pdf') return {type:'document',source:{type:'base64',media_type:'application/pdf',data:att.data}};
  if(att.type.startsWith('image/')) return {type:'image',source:{type:'base64',media_type:att.type,data:att.data}};
  return null;
}
async function extractOrder(att){
  const fb = fileBlock(att);
  if(!fb) throw new Error('AI can read PDF or image files only. For Word/Excel, please export as PDF.');
  if(att.size > 25*1024*1024) throw new Error('File is larger than 25 MB — please compress the PDF and try again.');
  const prompt = `You are reading a Purchase Order or BOQ / approved quotation for Watcon (swimming pools, water bodies, tiles, fireplaces, sauna/steam/spa equipment supply & installation).
Extract the data and respond ONLY with valid JSON, no markdown fences, no commentary:
{
 "clientName": "", "poNumber": "", "poDate": "YYYY-MM-DD or empty",
 "siteAddress": "",
 "terms": { "gst": "included|extra|unknown", "transport": "included|extra|unknown", "payment": "payment terms text or empty" },
 "items": [ { "description": "", "unit": "e.g. Nos/Sqft/Mtr/Lot", "qty": 0, "rate": 0 } ]
}
STRICT RULES to keep the output compact:
- Include ONLY real billable line items: rows that have a numeric quantity, a rate, and an amount.
- SKIP rows where the quantity is "RO", blank, or zero, and skip Make/Brand rows, Note rows, section headings, design details, and descriptive specification lines.
- Keep each description SHORT: max 12 words, prefixed with its section when helpful (e.g. "Jacuzzi - Piping cPVC 2.5 inch"). Never copy multi-line specification text.
- qty and rate must be plain numbers (no commas). Use the item rate, not the amount.
- If a value is not found use empty string, 0, or "unknown".
- Large BOQs can have 50-100 items; include every qualifying item but nothing else.`;
  const txt = await askClaude([fb,{type:'text',text:prompt}], 16000);
  let clean = txt.replace(/```json|```/g,'').trim();
  clean = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
  try{
    return JSON.parse(clean);
  }catch(e){
    // The reply may have been truncated mid-list on very large BOQs: salvage the complete items.
    const cut = clean.lastIndexOf('},');
    if(cut>0){
      const repaired = clean.slice(0,cut+1) + ']}';
      try{ const j=JSON.parse(repaired); j._truncated=true; return j; }catch(e2){}
    }
    throw new Error('The document is very large and the AI reply could not be fully read. Try splitting the BOQ into 2 smaller PDFs and attach them one by one.');
  }
}

function renderDash(){
  const ps = state.projects;

  ps.forEach(p=>{ totC+=contractValue(p); totD+=dispatchedValue(p); totP+=paidTotal(p); });
  app.innerHTML = `
    <div class="stats" style="margin-bottom:20px">
      <div class="stat hl"><div class="lbl">Active Projects</div><div class="val">${ps.filter(p=>p.status!=='Completed').length}</div></div>

      <div class="stat"><div class="lbl">Material Sent (value)</div><div class="val">${inr(totD)}</div></div>

    <div class="card"><div class="hd"><h3>Projects</h3>

    </div><div class="bd"><div class="plist" id="plist"></div></div></div>`;
  const list = document.getElementById('plist');
  function draw(f){
    list.innerHTML='';
    const rows = ps.filter(p=>!f || (p.name+' '+p.client+' '+(p.site||'')).toLowerCase().includes(f));
    if(!rows.length){ list.innerHTML='<div class="empty">No projects yet. Click <b>+ New Project</b> to add your first project.</div>'; return; }
    rows.slice().reverse().forEach(p=>{
      const cv=contractValue(p), dv=dispatchedValue(p), pd=paidTotal(p);
      const pct = cv>0? Math.min(100, dv/cv*100):0;
      const el=document.createElement('div'); el.className='card pitem';
      el.innerHTML=`<div><h4>${esc(p.name)}</h4><div class="sub">${esc(p.client)} · ${esc(p.site||'')} · <span class="chip teal">${esc(p.type)}</span> <span class="chip ${p.status==='Completed'?'green':p.status==='On Hold'?'gold':'grey'}">${esc(p.status)}</span></div></div>
      <div class="nums">Contract <span class="money">${inr(cv)}</span><br>Sent <span class="money">${inr(dv)}</span> · Received <span class="money" style="color:var(--ok)">${inr(pd)}</span></div>

      el.onclick=()=>{view={name:'project',id:p.id,tab:'overview'};render();};
      list.appendChild(el);
    });
  }
  draw('');
  document.getElementById('srch').oninput=e=>draw(e.target.value.toLowerCase());
}

    <p class="note" style="margin-bottom:10px">Attach the PDF or image — Claude will read it and prepare the Sales Order automatically. You can review and edit before saving.</p>

    <input type="file" id="orderFile" accept="application/pdf,image/*" style="display:none">

    <div id="aiStatus" style="margin-top:8px"></div>
    <div id="soEditor" style="margin-top:14px"></div>
    <div style="display:flex;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px">
      <button class="btn p" id="saveProj">Save project</button>
      <button class="btn" id="addItemBtn">+ Add sales order item manually</button>
    </div>
  </div></div>`;
  document.getElementById('bk').onclick=()=>{view={name:'dash'};render();};

  // approval mode segmented control
  const apNote=document.getElementById('apNote');
  function apHint(){
    const m=draft.approval.mode;
    apNote.textContent = m==='Purchase Order' ? 'Attach the purchase order copy below (it will also be read by AI to build the sales order).'
      : m==='Quote – Email approval' ? 'Attach a copy of the approval email (PDF or screenshot) here:'
      : m==='Quote – WhatsApp approval' ? 'Attach the WhatsApp approval screenshot here:'
      : 'Verbal approval — note who approved and when:';
    const box=document.getElementById('apAtt'); box.innerHTML='';
    if(m==='Quote – Verbal approval'){
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='e.g. Approved by Mr. Sharma on call, 12 Jan';
      inp.value=draft.approval.basis; inp.oninput=e=>draft.approval.basis=e.target.value; box.appendChild(inp);
    } else if(m!=='Purchase Order'){
      const d=document.createElement('div'); d.className='drop'; d.textContent='Attach approval copy (screenshot / PDF)';
      const fi=document.createElement('input'); fi.type='file'; fi.accept='application/pdf,image/*'; fi.style.display='none';
      d.onclick=()=>fi.click();
      fi.onchange=async e=>{ if(!e.target.files[0])return; const a=await readFile(e.target.files[0]); draft.approval.attachments.push(a); apHint(); };
      box.appendChild(d); box.appendChild(fi);
      draft.approval.attachments.forEach((a,i)=>box.appendChild(attRow(a,()=>{draft.approval.attachments.splice(i,1);apHint();})));
    }
  }
  document.querySelectorAll('#apMode button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#apMode button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    draft.approval.mode=b.dataset.v; apHint();
  });
  apHint();

  // order file + AI
  const drop=document.getElementById('orderDrop'), fi=document.getElementById('orderFile');
  drop.onclick=()=>fi.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over'); if(e.dataTransfer.files[0]) handleOrderFile(e.dataTransfer.files[0]);};
  fi.onchange=e=>{ if(e.target.files[0]) handleOrderFile(e.target.files[0]); };
  async function handleOrderFile(f){
    const st=document.getElementById('aiStatus');
    try{
      const a=await readFile(f); draft.orderAttachment=a;
      document.getElementById('orderAttBox').innerHTML=''; document.getElementById('orderAttBox').appendChild(attRow(a,()=>{draft.orderAttachment=null;document.getElementById('orderAttBox').innerHTML='';}));
      st.innerHTML='<span class="spin"></span><span class="ai-badge">Claude is reading the document and preparing the sales order…</span>';
      const j = await extractOrder(a);
      st.innerHTML='<span class="ai-badge">Sales order drafted — '+((j.items||[]).length)+' items read from the document. Review below and edit if needed.</span>'+(j._truncated?' <span class="chip gold">Partial: the document was very large, last few items may be missing — please verify.</span>':'');
      if(j.clientName && !document.getElementById('f_client').value) document.getElementById('f_client').value=j.clientName;
      if(j.siteAddress && !document.getElementById('f_site').value) document.getElementById('f_site').value=j.siteAddress;
      if(j.poNumber) document.getElementById('f_po').value=j.poNumber;
      if(j.poDate) document.getElementById('f_podate').value=j.poDate;
      if(j.terms){ if(j.terms.gst==='included')document.getElementById('f_gst').value='included';
        if(j.terms.transport==='included')document.getElementById('f_tr').value='included';
        if(j.terms.payment)document.getElementById('f_pay').value=j.terms.payment; }
      draft.items=(j.items||[]).map(it=>({id:uid(),description:it.description,unit:it.unit||'Nos',qty:Number(it.qty)||0,rate:Number(it.rate)||0}));
      drawSOEditor();
    }catch(err){
      st.innerHTML=`<span class="chip red">AI reading failed</span> <span class="note">${esc(err.message)} — you can still add items manually.</span>`;
    }
  }
  document.getElementById('addItemBtn').onclick=()=>{ draft.items.push({id:uid(),description:'',unit:'Nos',qty:1,rate:0}); drawSOEditor(); };
  function drawSOEditor(){
    const box=document.getElementById('soEditor');
    if(!draft.items.length){box.innerHTML='';return;}
    let h=`<h3 style="font-size:14px;margin-bottom:8px">Sales Order items</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:44%">Description</th><th>Unit</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th><th></th></tr></thead><tbody>`;
    draft.items.forEach((it,i)=>{ h+=`<tr>
      <td><input type="text" data-i="${i}" data-f="description" value="${esc(it.description)}"></td>
      <td><input type="text" data-i="${i}" data-f="unit" value="${esc(it.unit)}" style="width:70px"></td>
      <td><input type="number" data-i="${i}" data-f="qty" value="${it.qty}" style="width:90px;text-align:right"></td>
      <td><input type="number" data-i="${i}" data-f="rate" value="${it.rate}" style="width:110px;text-align:right"></td>
      <td class="r money">${inr(it.qty*it.rate)}</td>
      <td><button class="btn sm d" data-del="${i}">×</button></td></tr>`; });
    const base=orderBase(draft), gst=document.getElementById('f_gst').value==='extra'?base*state.settings.gstRate/100:0;
    h+=`</tbody><tfoot><tr><td colspan="4" class="r">Basic value</td><td class="r money">${inr(base)}</td><td></td></tr>
    ${gst?`<tr><td colspan="4" class="r">GST ${state.settings.gstRate}%</td><td class="r money">${inr(gst)}</td><td></td></tr>`:''}
    <tr><td colspan="4" class="r">Order value</td><td class="r money">${inr(base+gst)}</td><td></td></tr></tfoot></table></div>`;
    box.innerHTML=h;
    box.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=e=>{
      const it=draft.items[+e.target.dataset.i]; const f=e.target.dataset.f;
      it[f]= (f==='qty'||f==='rate') ? Number(e.target.value)||0 : e.target.value; drawSOEditor(); });
    box.querySelectorAll('button[data-del]').forEach(b=>b.onclick=()=>{draft.items.splice(+b.dataset.del,1);drawSOEditor();});
  }

  document.getElementById('saveProj').onclick=()=>{
    draft.name=document.getElementById('f_name').value.trim();
    draft.client=document.getElementById('f_client').value.trim();
    if(!draft.name||!draft.client){ toast('Project name and client are required'); return; }
    draft.site=document.getElementById('f_site').value.trim();
    draft.type=document.getElementById('f_type').value;
    draft.poNumber=document.getElementById('f_po').value.trim();
    draft.poDate=document.getElementById('f_podate').value;
    draft.terms={gst:document.getElementById('f_gst').value, transport:document.getElementById('f_tr').value, payment:document.getElementById('f_pay').value.trim()};
    state.projects.push(draft); save(); toast('Project saved');
    view={name:'project',id:draft.id,tab:'overview'}; render();
  };
}

function challanDocHTML(p,c){

  (c.items||[]).forEach(ci=>{ const it=p.items.find(x=>x.id===ci.itemId); if(!it)return;
    const q=(Number(ci.qty)||0)+(Number(ci.extraQty)||0); totalQty+=q;
    rows+=`<tr><td>${i++}</td><td>${esc(it.description)}</td><td>${esc(it.unit)}</td><td class="r">${q}</td></tr>`; });
  (c.extraItems||[]).forEach(x=>{ const q=Number(x.qty)||0; totalQty+=q;
    rows+=`<tr><td>${i++}</td><td>${esc(x.description)}</td><td>${esc(x.unit)}</td><td class="r">${q}</td></tr>`; });
  return `${docHead()}<div class="dtitle">Delivery Challan</div>
  <div class="meta"><div><b>Challan No:</b> ${esc(c.no)}<br><b>Date:</b> ${dfmt(c.date)}<br><b>Vehicle:</b> ${esc(c.vehicle||'—')}<br><b>Driver:</b> ${esc(c.driver||'—')}</div>
  <div style="text-align:right"><b>Delivered to:</b><br>${esc(p.client)}<br>${esc(p.site||'')}<br><b>Project:</b> ${esc(p.name)}${p.poNumber?'<br><b>Against PO:</b> '+esc(p.poNumber):''}</div></div>
  ${rows?`<table><thead><tr><th style="width:8%">S.No</th><th>Description of goods</th><th style="width:12%">Unit</th><th class="r" style="width:14%">Qty</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="3" class="r"><b>Total quantity — this challan</b></td><td class="r"><b>${totalQty}</b></td></tr></tfoot></table>`:''}
  ${c.remarks?`<p style="margin-top:8px"><b>Remarks:</b> ${esc(c.remarks)}</p>`:''}
  <p style="margin-top:8px;font-size:10.5px">Goods dispatched for the above project. This is a delivery challan, not an invoice. Please check material on receipt; any discrepancy to be reported within 48 hours.</p>
  <div class="sig"><div>Received by (name, sign & date)</div><div>For ${esc(state.settings.company)}<br>Authorised Signatory</div></div>`;
}

    <p class="note" style="margin-top:10px">Internal summary (not printed): <b>Challan value:</b> <span class="money">${inr(challanValue(p,c))}</span>${(c.items||[]).some(ci=>Number(ci.extraQty)>0)||(c.extraItems||[]).length?` · <b>Additional qty (beyond SO):</b> ${(c.items||[]).reduce((s2,ci)=>s2+(Number(ci.extraQty)||0),0)+(c.extraItems||[]).reduce((s2,x)=>s2+(Number(x.qty)||0),0)}`:''}</p>`,

     <button class="btn" id="mPr">Print</button>
     <button class="btn p" id="mOk">Close</button>`);

function modal(title, bodyHTML, footHTML){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="hd"><h3>${title}</h3><button id="mx">×</button></div><div class="bd">${bodyHTML}</div><div class="ft">${footHTML||''}</div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mx').onclick=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  return bg;
}

function challanModal(p, editing){
  if(!p.items.length && !editing){ toast('Add sales order items first — challan items are picked from the sales order.'); return; }
  const no = editing ? editing.no : state.settings.challanPrefix + String(state.settings.challanNext).padStart(3,'0');
  const prev = {}; if(editing) (editing.items||[]).forEach(ci=>prev[ci.itemId]={qty:Number(ci.qty)||0, extra:Number(ci.extraQty)||0});
  let rows=p.items.map(it=>{
    const issuedOthers = dispatchedQty(p,it.id) - (prev[it.id]?prev[it.id].qty:0); // issued on other challans
    const bal = it.qty - issuedOthers;
    const nowQ=prev[it.id]?prev[it.id].qty:0;
    const full=(issuedOthers+nowQ)>=it.qty;
    return `<tr><td>${esc(it.description)}</td><td>${esc(it.unit)}</td>
    <td class="r money">${it.qty}</td><td class="r money">${issuedOthers}</td><td class="r money" data-bal-show="${it.id}">${bal}</td>
    <td class="r"><input type="number" min="0" data-ch="${it.id}" data-bal="${bal}" data-so="${it.qty}" data-oth="${issuedOthers}" value="${nowQ}" style="width:84px;text-align:right"></td>

  bg.querySelectorAll('input[data-ch]').forEach(inp=>{

function generateBill(p){
  const bg=modal('Generate running bill',`
    <label class="f"><span class="t">Bill up to date (challans on or before this date are included)</span><input type="date" id="rb_date" value="${today()}"></label>
    <label class="f"><span class="t">Apply special discounts in this bill?</span><select id="rb_disc"><option value="yes">Yes — adjust discounts not yet billed</option><option value="no">No — bill without discount adjustment</option></select></label>`,
    `<button class="btn" id="mCancel">Cancel</button><button class="btn p" id="mGo">Generate</button>`);
  bg.querySelector('#mCancel').onclick=()=>bg.remove();
  bg.querySelector('#mGo').onclick=()=>{
    const upto=bg.querySelector('#rb_date').value;
    const lines=[];
    p.items.forEach(it=>{ const cq=dispatchedQty(p,it.id,upto); if(cq>0) lines.push({description:it.description,unit:it.unit,orderQty:it.qty,cumQty:cq,rate:it.rate,amount:cq*it.rate}); });
    let zoho=0; p.challans.forEach(c=>{ if(c.date<=upto && c.manualValue) zoho+=Number(c.manualValue)||0; });
    if(zoho>0) lines.push({description:'Material supplied vide attached Zoho challans (value basis)',unit:'LS',orderQty:'',cumQty:'',rate:'',amount:zoho});
    // extras: qty beyond BOQ on sales order items + items not in the sales order
    p.items.forEach(it=>{ const eq=extraQtyOf(p,it.id,upto); if(eq>0) lines.push({extra:true,description:it.description,unit:it.unit,orderQty:'—',cumQty:eq,rate:it.rate,amount:eq*it.rate}); });
    customDispatched(p,upto).forEach(x=>{ if(x.qty>0) lines.push({extra:true,description:x.description,unit:x.unit,orderQty:'—',cumQty:x.qty,rate:x.rate,amount:x.qty*(x.rate||0)}); });
    if(!lines.length){ toast('No challans found up to this date — nothing to bill.'); return; }
    const grossBasic = lines.reduce((s,l)=>s+l.amount,0);
    const priorDisc = p.bills.reduce((s,b)=>s+(b.discountApplied||0),0);
    const discCum = bg.querySelector('#rb_disc').value==='yes' ? discountTotal(p) : priorDisc;
    const discNow = Math.max(discCum-priorDisc,0);
    const gst = p.terms.gst==='extra' ? (grossBasic-discCum)*state.settings.gstRate/100 : 0;
    const grossToDate = grossBasic - discCum + gst;
    const priorBilled = p.bills.reduce((s,b)=>s+(Number(b.netPayable)||0),0);
    const netPayable = grossToDate - priorBilled;
    if(netPayable<=0){ toast('Everything dispatched up to this date is already billed.'); return; }
    const no = state.settings.billPrefix + (p.bills.length+1) + ' / ' + (p.poNumber||p.name);
    const b={id:uid(),no,date:upto,lines,grossBasic,discountApplied:discNow,discountCum:discCum,gst,grossToDate,priorBilled,netPayable};
    p.bills.push(b); save(); bg.remove(); render(); printBill(p,b);
  };
}

function siteAccountFigures(p){
  const basicDispatched = dispatchedValue(p);
  const disc = discountTotal(p);
  const taxable = Math.max(basicDispatched - disc, 0);
  const gst = p.terms.gst==='extra' ? taxable*(Number(state.settings.gstRate)||18)/100 : 0;
  const payableToDate = taxable + gst;
  const billed = billedTotal(p);
  const unbilled = Math.max(payableToDate - billed, 0);
  const received = paidTotal(p);
  const balance = payableToDate - received;
  return {basicDispatched,disc,gst,payableToDate,billed,unbilled,received,balance};
}

    <tr><td style="color:var(--warn)"><b>Unbilled amount as per challans issued</b></td><td class="r money" style="color:var(--warn)"><b>${inr(unbilled)}</b></td></tr>
    <tr><td style="color:var(--ok)"><b>Total payment received till today</b></td><td class="r money" style="color:var(--ok)"><b>${inr(received)}</b></td></tr>
    <tr><td style="color:${balance>0?'var(--danger)':'var(--ok)'}"><b>Balance payment (billable to date − received)</b></td><td class="r money" style="color:${balance>0?'var(--danger)':'var(--ok)'}"><b>${inr(balance)}</b></td></tr>
  </table></div>
  <p class="note" style="margin-top:10px">Unbilled = value of material already sent (challans) that is not yet covered by a running bill. Balance = everything billable on challan basis to date, less payments received.</p>
  </div></div></div>`;
  document.getElementById('accPrint').onclick=()=>doPrint(siteAccountDocHTML(p),'Site-Account-'+p.name);
}

/* ---------------- Discounts & Amendments ---------------- */
function tabAdjust(p,el){
  el.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  <div class="card"><div class="hd"><h3>Special discounts</h3><button class="btn sm p" id="dAdd" style="margin-left:auto">+ Give discount</button></div><div class="bd" id="dList"></div></div>
  <div class="card"><div class="hd"><h3>Amendments</h3><button class="btn sm p" id="aAdd" style="margin-left:auto">+ Add amendment</button></div><div class="bd" id="aList"></div></div></div>`;
  const dl=document.getElementById('dList');
  if(!p.discounts.length) dl.innerHTML='<div class="empty">No special discounts given.</div>';
  else p.discounts.forEach(d=>{const r=document.createElement('div');r.className='att';
    r.innerHTML=`<span class="nm">${esc(d.reason||'Special discount')}</span><span class="mt">${dfmt(d.date)}</span><span class="money" style="color:var(--danger)">− ${inr(d.amount)}</span>`;
    const x=document.createElement('button');x.className='btn sm d';x.textContent='×';x.onclick=()=>confirmModal('Remove this discount?',()=>{p.discounts=p.discounts.filter(z=>z.id!==d.id);save();render();});r.appendChild(x);dl.appendChild(r);});
  document.getElementById('dAdd').onclick=()=>{
    const bg=modal('Give special discount',`
      <div class="frow"><label class="f"><span class="t">Date</span><input type="date" id="sd_d" value="${today()}"></label>
      <label class="f"><span class="t">Discount amount (₹, on basic value) *</span><input type="number" id="sd_a"></label></div>
      <label class="f"><span class="t">Reason / approved by</span><input type="text" id="sd_r" placeholder="e.g. Goodwill discount approved by Adit"></label>`,
      `<button class="btn" id="mCancel">Cancel</button><button class="btn p" id="mSave">Apply discount</button>`);
    bg.querySelector('#mCancel').onclick=()=>bg.remove();
    bg.querySelector('#mSave').onclick=()=>{const a=Number(bg.querySelector('#sd_a').value)||0;if(a<=0){toast('Enter amount');return;}
      p.discounts.push({id:uid(),date:bg.querySelector('#sd_d').value,amount:a,reason:bg.querySelector('#sd_r').value});save();bg.remove();render();};
  };
  const al=document.getElementById('aList');
  if(!p.amendments.length) al.innerHTML='<div class="empty">No amendments. Use this when the client changes scope — attach the approved amendment copy.</div>';
  else p.amendments.forEach(a=>{const r=document.createElement('div');r.className='att';
    r.innerHTML=`<span class="nm">${esc(a.desc)}</span><span class="mt">${dfmt(a.date)}</span><span class="money" style="color:${a.valueChange<0?'var(--danger)':'var(--ok)'}">${a.valueChange<0?'−':'+'} ${inr(Math.abs(a.valueChange))}</span>`;
    if(a.attachment){const v=document.createElement('button');v.className='btn sm';v.textContent='View';v.onclick=()=>downloadAtt(a.attachment);r.appendChild(v);}
    const x=document.createElement('button');x.className='btn sm d';x.textContent='×';x.onclick=()=>confirmModal('Remove this amendment?',()=>{p.amendments=p.amendments.filter(z=>z.id!==a.id);save();render();});r.appendChild(x);al.appendChild(r);});
  document.getElementById('aAdd').onclick=()=>{
    const bg=modal('Add amendment',`
      <div class="frow"><label class="f"><span class="t">Date</span><input type="date" id="am_d" value="${today()}"></label>
      <label class="f"><span class="t">Value change (₹, use minus for reduction) *</span><input type="number" id="am_v"></label></div>
      <label class="f"><span class="t">Description *</span><input type="text" id="am_t" placeholder="e.g. Additional heat pump added to scope"></label>
      <label class="f"><span class="t">Approval copy (PO amendment / email / WhatsApp)</span><input type="file" id="am_f" accept="application/pdf,image/*"></label>`,
      `<button class="btn" id="mCancel">Cancel</button><button class="btn p" id="mSave">Save amendment</button>`);
    bg.querySelector('#mCancel').onclick=()=>bg.remove();
    bg.querySelector('#mSave').onclick=async()=>{
      const t=bg.querySelector('#am_t').value.trim(), v=Number(bg.querySelector('#am_v').value);
      if(!t||isNaN(v)){toast('Description and value change are required');return;}
      let att=null; const f=bg.querySelector('#am_f').files[0]; if(f)att=await readFile(f);
      p.amendments.push({id:uid(),date:bg.querySelector('#am_d').value,desc:t,valueChange:v,attachment:att});save();bg.remove();render();};
  };
}

/* ---------------- Documents ---------------- */
function tabDocs(p,el){
  el.innerHTML=`<div class="card"><div class="hd"><h3>Project documents</h3></div><div class="bd">
    <h4 style="font-size:13px;margin-bottom:8px">Order copy (PO / BOQ / approved quotation)</h4><div id="dOrder"></div>
    <div style="margin:6px 0 18px"><button class="btn sm" id="reAI">Re-run AI reading → rebuild sales order</button> <span id="reAIst"></span></div>
    <h4 style="font-size:13px;margin-bottom:8px">Approval proof (${esc(p.approval.mode)})</h4><div id="dAppr"></div>
    <h4 style="font-size:13px;margin:18px 0 8px">Challan copies</h4><div id="dCh"></div>
    <h4 style="font-size:13px;margin:18px 0 8px">Amendment approvals</h4><div id="dAm"></div>
  </div></div>`;
  const dO=document.getElementById('dOrder');
  if(p.orderAttachment) dO.appendChild(attRow(p.orderAttachment,()=>{p.orderAttachment=null;save();render();}));
  else{ const fi=document.createElement('input');fi.type='file';fi.accept='application/pdf,image/*';
    fi.onchange=async e=>{if(!e.target.files[0])return;p.orderAttachment=await readFile(e.target.files[0]);save();render();};dO.appendChild(fi); }
  document.getElementById('reAI').onclick=async()=>{
    if(!p.orderAttachment){toast('Attach the order copy first');return;}
    const st=document.getElementById('reAIst'); st.innerHTML='<span class="spin"></span>Reading…';
    try{ const j=await extractOrder(p.orderAttachment);
      st.textContent='';
      confirmModal('Replace current sales order items with '+(j.items||[]).length+' item(s) read from the document?', ()=>{
        p.items=(j.items||[]).map(it=>({id:uid(),description:it.description,unit:it.unit||'Nos',qty:Number(it.qty)||0,rate:Number(it.rate)||0}));
        p.aiGenerated=true; save(); render(); toast('Sales order rebuilt'); });
    }catch(err){ st.innerHTML='<span class="chip red">Failed</span> '+esc(err.message); }
  };
  const dA=document.getElementById('dAppr');
  if(p.approval.mode==='Quote – Verbal approval') dA.innerHTML=`<p class="note">${esc(p.approval.basis||'Verbal approval — no attachment.')}</p>`;
  else{ (p.approval.attachments||[]).forEach((a,i)=>dA.appendChild(attRow(a,()=>{p.approval.attachments.splice(i,1);save();render();})));
    const fi=document.createElement('input');fi.type='file';fi.accept='application/pdf,image/*';
    fi.onchange=async e=>{if(!e.target.files[0])return;p.approval.attachments=p.approval.attachments||[];p.approval.attachments.push(await readFile(e.target.files[0]));save();render();};dA.appendChild(fi); }
  const dC=document.getElementById('dCh'); let any=false;
  p.challans.forEach(c=>{if(c.attachment){any=true;const r=attRow(c.attachment);r.querySelector('.nm').textContent='📎 '+c.no+' — '+c.attachment.name;dC.appendChild(r);}});
  if(!any) dC.innerHTML='<p class="note">No challan copies attached yet.</p>';
  const dM=document.getElementById('dAm'); any=false;
  p.amendments.forEach(a=>{if(a.attachment){any=true;const r=attRow(a.attachment);r.querySelector('.nm').textContent='📎 '+a.desc;dM.appendChild(r);}});
  if(!any) dM.innerHTML='<p class="note">No amendment approvals attached.</p>';
}
/* ---------------- Printing ---------------- */
function docHead(){
  const s=state.settings;
  return `<div class="dhead"><div>
    <img src="${WATCON_LOGO}" alt="${esc(s.company)}" style="height:46px;display:block;margin-bottom:6px">
    <div class="co">${esc(s.address)}${s.phone?'<br>Ph: '+esc(s.phone):''}${s.email?' · Email: '+esc(s.email):''}${s.gstin?'<br>GSTIN: '+esc(s.gstin):''}</div></div>
  <div class="co" style="text-align:right"><b>${esc(s.company)}</b><br>Pools · Water Bodies · Tiles<br>Fireplaces · Sauna · Steam · Spa</div></div>`;
}
function doPrint(html, title){
  document.getElementById('printArea').innerHTML=`<div class="doc">${html}</div>`;
  const bg=modal(title||'Print preview',`
    <div class="doc-preview"><div class="doc">${html}</div></div>
    <p class="note" style="margin-top:10px">If nothing happens on Print (inside the Claude preview), use <b>Download</b> — the file opens in your browser and prints automatically. On your Netlify deployment, Print works directly.</p>`,
    `<button class="btn" id="dlDoc">Download (HTML)</button><button class="btn p" id="prDoc">Print</button><button class="btn" id="mOk">Close</button>`);
  bg.querySelector('#mOk').onclick=()=>bg.remove();
  bg.querySelector('#prDoc').onclick=()=>{ try{ window.print(); }catch(e){ toast('Printing is blocked here — use Download instead.'); } };
  bg.querySelector('#dlDoc').onclick=()=>{
    const docCss=`body{font-family:Arial,Helvetica,sans-serif;margin:24px}
.doc{max-width:190mm;margin:0 auto;font-size:12px;color:#000}
.doc .dhead{display:flex;justify-content:space-between;border-bottom:2.5px solid #000;padding-bottom:10px}
.doc .dhead h1{font-size:20px;letter-spacing:.5px;margin:0}
.doc .dhead .co{font-size:11px;line-height:1.45}
.doc .dtitle{text-align:center;font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:12px 0;border:1.5px solid #000;padding:5px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc table th,.doc table td{border:1px solid #000;padding:5px 7px;font-size:11.5px;text-align:left}
.doc table td.r,.doc table th.r{text-align:right;font-family:monospace}
.doc .meta{display:flex;justify-content:space-between;gap:20px;margin-top:8px;font-size:11.5px}
.doc .sig{display:flex;justify-content:space-between;margin-top:60px;font-size:11.5px}
.doc .sig div{border-top:1px solid #000;padding-top:5px;width:180px;text-align:center}`;
    const page=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title||'Watcon document')}</title><style>${docCss}</style></head><body><div class="doc">${html}</div><script>window.onload=function(){window.print();}<\/script></body></html>`;
    const a=document.createElement('a');
    a.href='data:text/html;charset=utf-8,'+encodeURIComponent(page);
    a.download=(title||'watcon-document').replace(/[^\w\-]+/g,'-')+'.html'; a.click();
  };
}

function printChallan(p,c){
  doPrint(challanDocHTML(p,c), 'Challan '+c.no);
}

function printBill(p,b){
  const A=b.lines.filter(l=>!l.extra), B=b.lines.filter(l=>l.extra);
  const subA=A.reduce((s,l)=>s+l.amount,0), subB=B.reduce((s,l)=>s+l.amount,0);
  let rows='',i=1;
  const line=(l,tag)=>`<tr><td>${i++}</td><td>${esc(l.description)}${tag?` <i>${tag}</i>`:''}</td><td>${esc(l.unit)}</td><td class="r">${l.orderQty}</td><td class="r">${l.cumQty}</td><td class="r">${l.rate!==''?Number(l.rate).toLocaleString('en-IN'):''}</td><td class="r">${tag?'✓':'—'}</td><td class="r">${Number(l.amount).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`;
  rows+=`<tr><td colspan="8" style="background:#f0f0f0"><b>A. Supply as per Sales Order / BOQ</b></td></tr>`;
  A.forEach(l=>rows+=line(l,''));
  rows+=`<tr><td colspan="7" class="r"><b>Sub-total A</b></td><td class="r"><b>${subA.toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td></tr>`;
  if(B.length){
    rows+=`<tr><td colspan="8" style="background:#f0f0f0"><b>B. Extra items / quantities sent to site — not in Sales Order</b></td></tr>`;
    B.forEach(l=>rows+=line(l,'(beyond SO)'));
    rows+=`<tr><td colspan="7" class="r"><b>Sub-total B (extras)</b></td><td class="r"><b>${subB.toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td></tr>`;
  }
  doPrint(`${docHead()}<div class="dtitle">Running Account Bill</div>
  <div class="meta"><div><b>Bill No:</b> ${esc(b.no)}<br><b>Bill date:</b> ${dfmt(b.date)}<br><b>Bill basis:</b> Cumulative material dispatched vide challans up to ${dfmt(b.date)}</div>
  <div style="text-align:right"><b>Client:</b> ${esc(p.client)}<br>${esc(p.site||'')}<br><b>Project:</b> ${esc(p.name)}${p.poNumber?'<br><b>PO ref:</b> '+esc(p.poNumber)+' dt '+dfmt(p.poDate):''}</div></div>
  <table><thead><tr><th>S.No</th><th>Description</th><th>Unit</th><th class="r">Order Qty</th><th class="r">Qty to date</th><th class="r">Rate (₹)</th><th class="r">Beyond SO</th><th class="r">Amount (₹)</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot>
   <tr><td colspan="7" class="r"><b>Gross value of work / supply to date (A${B.length?' + B':''})</b></td><td class="r"><b>${Number(b.grossBasic).toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td></tr>
   ${(b.discountCum||b.discountApplied)?`<tr><td colspan="7" class="r">Less: special discount (to date)</td><td class="r">− ${Number(b.discountCum||b.discountApplied).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`:''}
   ${b.gst?`<tr><td colspan="7" class="r">Add: GST @ ${state.settings.gstRate}% (as per terms — extra)</td><td class="r">${Number(b.gst).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>`:`<tr><td colspan="7" class="r">GST included in rates (as per terms)</td><td class="r">—</td></tr>`}
   <tr><td colspan="7" class="r"><b>Gross payable to date</b></td><td class="r"><b>${Number(b.grossToDate).toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td></tr>
   <tr><td colspan="7" class="r">Less: billed in previous running bills</td><td class="r">− ${Number(b.priorBilled).toLocaleString('en-IN',{minimumFractionDigits:2})}</td></tr>
   <tr><td colspan="7" class="r"><b>NET PAYABLE — THIS BILL</b></td><td class="r"><b>${Number(b.netPayable).toLocaleString('en-IN',{minimumFractionDigits:2})}</b></td></tr>
  </tfoot></table>
  <p style="margin-top:8px;font-size:10.5px"><b>Payment terms:</b> ${esc(p.terms.payment||'As agreed')} · <b>Transport:</b> ${p.terms.transport==='extra'?'Extra at actuals':'Included'}</p>
  <div class="sig"><div>Client / Site Engineer</div><div>For ${esc(state.settings.company)}<br>Authorised Signatory</div></div>`, 'Bill '+b.no);
}

/* ---------------- Settings ---------------- */
function renderSettings(){
  const s=state.settings;
  app.innerHTML=`<button class="back" id="bk">← Back</button>
  <div class="card" style="max-width:640px"><div class="hd"><h3>Settings</h3></div><div class="bd">
    <div class="frow">
      <label class="f"><span class="t">Company name (on challans & bills)</span><input type="text" id="s_co" value="${esc(s.company)}"></label>
      <label class="f"><span class="t">Address</span><input type="text" id="s_ad" value="${esc(s.address)}"></label>
      <label class="f"><span class="t">Phone</span><input type="text" id="s_ph" value="${esc(s.phone)}"></label>
      <label class="f"><span class="t">Email</span><input type="text" id="s_em" value="${esc(s.email||'')}"></label>
      <label class="f"><span class="t">GSTIN</span><input type="text" id="s_gs" value="${esc(s.gstin)}"></label>
      <label class="f"><span class="t">GST rate %</span><input type="number" id="s_gr" value="${s.gstRate}"></label>
      <label class="f"><span class="t">Challan number prefix</span><input type="text" id="s_cp" value="${esc(s.challanPrefix)}"></label>
      <label class="f"><span class="t">Next challan number</span><input type="number" id="s_cn" value="${s.challanNext}"></label>
      <label class="f"><span class="t">Bill number prefix</span><input type="text" id="s_bp" value="${esc(s.billPrefix)}"></label>
    </div>
    <label class="f"><span class="t">Anthropic API key (only needed after deploying to Netlify — leave blank inside Claude)</span><input type="text" id="s_key" value="${esc(s.apiKey)}" placeholder="sk-ant-…"></label>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="btn p" id="sSave">Save settings</button>
      <button class="btn" id="sExport">Export data backup (JSON)</button>
      <button class="btn" id="sImport">Import backup</button>
      <input type="file" id="sImpFile" accept="application/json" style="display:none">
    </div>
    <p class="note" style="margin-top:14px">Data is stored in this browser (localStorage) when the file is deployed to Netlify or opened directly. Take a JSON backup regularly — attachments are included in the backup.</p>
  </div></div>`;
  document.getElementById('bk').onclick=()=>{view={name:'dash'};render();};
  document.getElementById('sSave').onclick=()=>{
    s.company=document.getElementById('s_co').value; s.address=document.getElementById('s_ad').value;
    s.phone=document.getElementById('s_ph').value; s.email=document.getElementById('s_em').value; s.gstin=document.getElementById('s_gs').value;
    s.gstRate=Number(document.getElementById('s_gr').value)||18;
    s.challanPrefix=document.getElementById('s_cp').value; s.challanNext=Number(document.getElementById('s_cn').value)||1;
    s.billPrefix=document.getElementById('s_bp').value||'RA-';
    s.apiKey=document.getElementById('s_key').value.trim();
    save(); toast('Settings saved');
  };
  document.getElementById('sExport').onclick=()=>{
    const a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state));
    a.download='watcon-pm-backup-'+today()+'.json'; a.click();
  };
  document.getElementById('sImport').onclick=()=>document.getElementById('sImpFile').click();
  document.getElementById('sImpFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.projects) throw new Error('Not a Watcon backup file');
      confirmModal('Replace all current data with this backup?', ()=>{ state=j; save(); toast('Backup restored'); view={name:'dash'}; render(); }); }
      catch(err){ toast('Import failed: '+err.message); } };
    r.readAsText(f);
  };
}

if(!store.ok()) console.warn('localStorage unavailable — running with in-memory data (Claude preview). Deploy to Netlify for persistence.');
render();
</script>
